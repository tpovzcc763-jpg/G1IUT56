<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bus Ticket — Demo</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #231F20; }
    #unity-canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; background: #231F20; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <script src="Build/BusTicketWebURL.loader.js"></script>
  <script>
    const canvas = document.querySelector('#unity-canvas');
    createUnityInstance(canvas, {
      dataUrl: 'Build/BusTicketWebURL.data',
      frameworkUrl: 'Build/BusTicketWebURL.framework.js',
      codeUrl: 'Build/BusTicketWebURL.wasm',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'DefaultCompany',
      productName: 'Bus Ticket',
      productVersion: '1.0.2'
    }).catch(error => alert('Unity failed to load: ' + error));
  </script>
</body>
</html>
